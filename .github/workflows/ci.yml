name: CPU smoke and publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,runtime]"
      - run: python -m pytest
      - run: python examples/synthetic_smoke.py
      - run: python scripts/audit_publication.py
